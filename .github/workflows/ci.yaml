name: Node.js CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  build:
    name: "Build and run integration tests"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: &node-versions
          - 20.x # LTS
          - 22.x # LTS
          - 24.x # LTS
    steps:
      - uses: actions/checkout@v3
      - uses: pnpm/action-setup@v4 # The version in package.json's packageManager
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"
      - name: Install Rust # Builds Grats (grats-rs/) natively, and for the website
        working-directory: ./grats-rs
        run: rustup toolchain install
      - name: Install Deno # Runs the Deno example in `test-example-projects`
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install dependencies
        run: pnpm install
      - name: Build
        run: pnpm run build
      - name: Install dependencies
        run: pnpm install -r
      - name: Build Grats for each project
        run: pnpm run --filter="!website" -r grats
      - name: Assert no files changed after grats generation
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "Files were modified after running grats:"
            git status --porcelain
            git diff
            exit 1
          fi
      - name: Build Other Packages (excluding docs website)
        run: pnpm run --filter="!website" -r build
      - name: Test Example Projects
        run: pnpm run test-example-projects
      - name: Test tsconfig compatibility # Runs `tsc` over each combination
        run: pnpm run test-tsconfig-compat
      - name: Build Docs Website
        working-directory: ./website
        run: ./scripts/build.sh
  test:
    name: "JS Tests"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: *node-versions
        typescript-version:
          - "5.5.4"
          - "5.7.3"
          - "5.9.3"
          - "6.0.2"
    steps:
      - uses: actions/checkout@v3
      - uses: pnpm/action-setup@v4 # The version in package.json's packageManager
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install
      - name: Install TypeScript ${{ matrix.typescript-version }}
        run: pnpm add -wD typescript@${{ matrix.typescript-version }}
      - name: Build # Integration tests depend upon having .js versions created by tsc
        run: pnpm run build:js
      - name: Unit Tests
        run: pnpm run test
  lint:
    name: "Lint"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: *node-versions
    steps:
      - uses: actions/checkout@v3
      - uses: pnpm/action-setup@v4 # The version in package.json's packageManager
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install
      - name: Lint
        run: pnpm run lint
      - name: Type-check the website
        run: pnpm --filter website run typecheck
  rust:
    name: "Rust"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./grats-rs
    steps:
      - uses: actions/checkout@v3
      - name: Install Rust
        run: rustup toolchain install
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
      - name: Clippy (WebAssembly) # For the website's playground
        run: cargo clippy --package grats_wasm --target wasm32-unknown-unknown -- -D warnings
  wasm:
    name: "WebAssembly"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: pnpm/action-setup@v4 # The version in package.json's packageManager
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: "pnpm"
      - name: Install Rust
        working-directory: ./grats-rs
        run: rustup toolchain install
      - name: Install dependencies
        run: pnpm install
      - name: Test # Builds Grats for the website's playground, and tests it
        run: pnpm run test:wasm
  build-binary:
    name: "Native binary (${{ matrix.target }})"
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            platform: linux-x64
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            platform: linux-arm64
          - target: x86_64-apple-darwin
            os: macos-latest
            platform: macos-x64
            # Cross-compiled, so it's neither tested nor run.
            cross: true
          - target: aarch64-apple-darwin
            os: macos-latest
            platform: macos-arm64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            platform: win-x64
            exe: .exe
    defaults:
      run:
        shell: bash
        working-directory: ./grats-rs
    steps:
      - uses: actions/checkout@v3
      - name: Install Rust
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}
      - name: Install musl
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Set dev version (branch)
        # Must match the version the publish job gives the package.
        if: github.ref_type == 'branch'
        run: echo "GRATS_VERSION=0.0.0-main-${GITHUB_SHA:0:8}" >> "$GITHUB_ENV"
      - name: Test
        if: ${{ !matrix.cross }}
        run: cargo test
      - name: Build
        run: cargo build --release --package grats_cli --target ${{ matrix.target }}
      - name: Smoke test
        if: ${{ !matrix.cross }}
        run: |
          grats="$PWD/target/${{ matrix.target }}/release/grats"
          project="$RUNNER_TEMP/smoke"
          mkdir -p "$project/src"
          cd "$project"
          echo '{ "include": ["src"] }' > tsconfig.json
          printf '/** @gqlQueryField */\nexport function hello(): string {\n  return "Hello";\n}\n' > src/index.ts
          # A type defined in another module, found through module resolution.
          printf '/** @gqlType */\nexport class Greeting {\n  /** @gqlField */\n  text: string = "Hi";\n}\n' > src/greeting.ts
          printf 'import { Greeting } from "./greeting";\n\n/** @gqlQueryField */\nexport function greeting(): Greeting {\n  return new Greeting();\n}\n' > src/queries.ts
          "$grats" || { echo "grats exited with $?"; exit 1; }
          cat schema.graphql
          grep -q "hello: String" schema.graphql
          grep -q "greeting: Greeting" schema.graphql
          "$grats" locate Query.hello > locate.txt || { echo "grats locate exited with $?"; cat locate.txt; exit 1; }
          cat locate.txt
          grep -q "index.ts:2:17" locate.txt
      - name: Smoke test watch mode
        if: ${{ !matrix.cross }}
        run: |
          grats="$PWD/target/${{ matrix.target }}/release/grats"
          cd "$RUNNER_TEMP/smoke"
          "$grats" --watch > watch.log 2>&1 &
          pid=$!
          wait_for() {
            for _ in $(seq 100); do
              grep -q "$2" "$1" && return 0
              sleep 0.1
            done
            echo "Timed out waiting for \"$2\" in $1"
            cat watch.log
            kill $pid
            exit 1
          }
          wait_for watch.log "Wrote schema"
          sleep 1
          printf '/** @gqlQueryField */\nexport function goodbye(): string {\n  return "Goodbye";\n}\n' > src/other.ts
          wait_for schema.graphql "goodbye: String"
          printf '/** @gqlQueryField */\nexport function hi(): string {\n  return "Hi";\n}\n' > src/index.ts
          wait_for schema.graphql "hi: String"
          kill $pid
      - name: Upload the binary
        uses: actions/upload-artifact@v4
        with:
          # The publish job puts it in `bin/<platform>/` (see `bin/binaryPath.js`).
          name: ${{ matrix.platform }}
          path: grats-rs/target/${{ matrix.target }}/release/grats${{ matrix.exe }}
          if-no-files-found: error
  publish:
    name: Publish to NPM
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && github.repository == 'captbaritone/grats'
    needs: [build, test, lint, rust, wasm, build-binary]
    permissions:
      # `contents: write` so the tag build can create the GitHub release.
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v3
      - uses: pnpm/action-setup@v4 # The version in package.json's packageManager
      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm"
      - name: Ensure npm 11.5.1 or later for trusted publishing
        run: npm install -g npm@11.7.0
      - name: Install dependencies
        run: pnpm install
      - name: Build # The types. The binaries were built by `build-binary`.
        run: pnpm run build:js
      - name: Download the binaries
        uses: actions/download-artifact@v4
        with:
          path: bin
      - name: Restore the binaries' executable bit
        run: chmod +x bin/*/grats
      - name: Set dev version (branch)
        if: github.ref_type == 'branch'
        run: pnpm version --no-git-tag-version 0.0.0-main-${RELEASE_COMMIT_SHA:0:8}
        env:
          RELEASE_COMMIT_SHA: ${{ github.sha }}
      - name: Check the binaries' version
        run: |
          expected="grats $(node -p 'require("./package.json").version')"
          actual="$(bin/linux-x64/grats --version)"
          if [ "$actual" != "$expected" ]; then
            echo "Expected \"$expected\", but the binary reports \"$actual\""
            exit 1
          fi
      - name: Pack
        # With npm, which keeps the binaries' executable bit, unlike pnpm.
        run: npm pack --pack-destination "$RUNNER_TEMP"
      - name: Smoke test the package
        run: |
          project="$RUNNER_TEMP/consumer"
          mkdir -p "$project/src"
          cd "$project"
          echo '{ "type": "module" }' > package.json
          npm install "$RUNNER_TEMP"/grats-*.tgz
          echo '{ "include": ["src"] }' > tsconfig.json
          printf 'import { Int } from "grats";\n\n/** @gqlQueryField */\nexport function count(): Int {\n  return 1;\n}\n' > src/index.ts
          npx grats
          grep -q "count: Int" schema.graphql
          node --input-type=module -e 'import "grats";'
      - name: Publish dev version (branch)
        if: github.ref_type == 'branch'
        run: npm publish "$RUNNER_TEMP"/grats-*.tgz --tag main --access=public
      - name: Publish release (tag)
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm publish "$RUNNER_TEMP"/grats-*.tgz --access=public
      - name: Create the GitHub release (tag)
        if: startsWith(github.ref, 'refs/tags/v')
        # Points at the version's changelog entry, like the releases before it.
        # Tag `v0.0.36` becomes anchor `#0036`.
        run: |
          version="${GITHUB_REF_NAME#v}"
          anchor="$(echo "$version" | tr -d '.')"
          gh release create "$GITHUB_REF_NAME" \
            --title "Grats $GITHUB_REF_NAME" \
            --notes "https://grats.capt.dev/docs/changelog/#$anchor"
        env:
          GH_TOKEN: ${{ github.token }}
