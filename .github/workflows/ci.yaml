name: Node.js CI

on:
  push:
    branches: [main, grats-rs-port]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  build:
    name: "Build and run integration tests"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: &node-versions
          - 20.x # LTS
          - 22.x # LTS
          - 24.x # LTS
    steps:
      - uses: actions/checkout@v3
      - uses: pnpm/action-setup@v2
        with:
          version: 9.3.0
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"
      - name: Install Rust # Builds the Rust port of Grats (grats-rs/) to WebAssembly
        working-directory: ./grats-rs
        run: rustup toolchain install
      - name: Install dependencies
        run: pnpm install
      - name: Build
        run: pnpm run build
      - name: Install dependencies
        run: pnpm install -r
      - name: Build Grats for each project
        run: pnpm run --filter="!website" -r grats
      - name: Assert no files changed after grats generation
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "Files were modified after running grats:"
            git status --porcelain
            git diff
            exit 1
          fi
      - name: Build the native binary
        working-directory: ./grats-rs
        run: cargo build --release --package grats_cli
      - name: Build Grats for each project with the native binary
        run: |
          for dir in examples/*/; do
            if [ -f "$dir/package.json" ]; then
              (cd "$dir" && "$GITHUB_WORKSPACE/grats-rs/target/release/grats")
            fi
          done
      - name: Assert no files changed after native grats generation
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "Files were modified after running the native binary:"
            git status --porcelain
            git diff
            exit 1
          fi
      - name: Build Other Packages (excluding docs website)
        run: pnpm run --filter="!website" -r build
      - name: Test Example Projects
        run: pnpm run test-example-projects
      - name: Build Docs Website
        # The website isn't expected to work on the Rust port's branch yet.
        if: github.ref != 'refs/heads/grats-rs-port'
        working-directory: ./website
        run: ./scripts/build.sh
  test:
    name: "JS Tests"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: *node-versions
        typescript-version:
          - "5.5.4"
          - "5.7.3"
          - "5.9.3"
          - "6.0.2"
    steps:
      - uses: actions/checkout@v3
      - uses: pnpm/action-setup@v2
        with:
          version: 9.3.0
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"
      - name: Install Rust # Builds the Rust port of Grats (grats-rs/) to WebAssembly
        working-directory: ./grats-rs
        run: rustup toolchain install
      - name: Install dependencies
        run: pnpm install
      - name: Install TypeScript ${{ matrix.typescript-version }}
        run: pnpm add -wD typescript@${{ matrix.typescript-version }}
      - name: Build # Integration tests depend upon having .js versions created by tsc
        run: pnpm run build
      - name: Unit Tests
        run: pnpm run test
  lint:
    name: "Lint"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: *node-versions
    steps:
      - uses: actions/checkout@v3
      - uses: pnpm/action-setup@v2
        with:
          version: 9.3.0
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install
      - name: Lint
        run: pnpm run lint
  rust:
    name: "Rust"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./grats-rs
    steps:
      - uses: actions/checkout@v3
      - name: Install Rust
        run: rustup toolchain install
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
  native:
    name: "Native binary (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: ./grats-rs
    steps:
      - uses: actions/checkout@v3
      - name: Install Rust
        run: rustup toolchain install
      - name: Test
        run: cargo test
      - name: Build
        run: cargo build --release --package grats_cli
      - name: Smoke test
        shell: bash
        run: |
          grats="$PWD/target/release/grats"
          project="$RUNNER_TEMP/smoke"
          mkdir -p "$project/src"
          cd "$project"
          echo '{ "include": ["src"] }' > tsconfig.json
          printf '/** @gqlQueryField */\nexport function hello(): string {\n  return "Hello";\n}\n' > src/index.ts
          "$grats"
          grep -q "hello: String" schema.graphql
          "$grats" locate Query.hello | grep -q "index.ts:2:17"
      - name: Smoke test watch mode
        shell: bash
        run: |
          grats="$PWD/target/release/grats"
          cd "$RUNNER_TEMP/smoke"
          "$grats" --watch > watch.log 2>&1 &
          pid=$!
          wait_for() {
            for _ in $(seq 100); do
              grep -q "$2" "$1" && return 0
              sleep 0.1
            done
            echo "Timed out waiting for \"$2\" in $1"
            cat watch.log
            kill $pid
            exit 1
          }
          wait_for watch.log "Wrote schema"
          sleep 1
          printf '/** @gqlQueryField */\nexport function goodbye(): string {\n  return "Goodbye";\n}\n' > src/other.ts
          wait_for schema.graphql "goodbye: String"
          printf '/** @gqlQueryField */\nexport function hi(): string {\n  return "Hi";\n}\n' > src/index.ts
          wait_for schema.graphql "hi: String"
          kill $pid
  publish:
    name: Publish to NPM
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/grats-rs-port' || startsWith(github.ref, 'refs/tags/v')) && github.repository == 'captbaritone/grats'
    needs: [build, test, lint, rust, native]
    permissions:
      contents: read
      id-token: write
    env:
      # npm dist-tag for prerelease builds published from branches.
      NPM_TAG: ${{ github.ref == 'refs/heads/grats-rs-port' && 'rust' || 'main' }}
    steps:
      - uses: actions/checkout@v3
      - uses: pnpm/action-setup@v2
        with:
          version: 9.3.0
      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm"
      - name: Ensure npm 11.5.1 or later for trusted publishing
        run: npm install -g npm@11.7.0
      - name: Install Rust # Builds the Rust port of Grats (grats-rs/) to WebAssembly
        working-directory: ./grats-rs
        run: rustup toolchain install
      - name: Install dependencies
        run: pnpm install
      - name: Build
        run: pnpm run build
      - name: Set dev version (branch)
        if: github.ref_type == 'branch'
        run: pnpm version --no-git-tag-version 0.0.0-${NPM_TAG}-${RELEASE_COMMIT_SHA:0:8}
        env:
          RELEASE_COMMIT_SHA: ${{ github.sha }}
      - name: Publish dev version (branch)
        if: github.ref_type == 'branch'
        run: pnpm publish --tag ${NPM_TAG} --access=public --no-git-checks
      - name: Publish release (tag)
        if: startsWith(github.ref, 'refs/tags/v')
        run: pnpm publish --access=public --no-git-checks
